name: ios-verify

on:
  push:
    branches:
      - master
      - agent/**
      - docs/**
      - chore/**
    paths:
      - 'ios/**'
      - '.github/workflows/ios-verify.yml'
      - 'AGENTS.md'
      - 'docs/operators/branch-and-ci-conventions.md'
      - 'docs/operators/branch-prefixes.json'
      - 'docs/planning/testing-lanes.md'
      - 'docs/planning/native-ios-app-plan.md'
      - 'docs/planning/issue-236-implementation-brief.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane-ios:
    name: lane-ios
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    runs-on:
      - self-hosted
      - macOS
      - ios
    steps:
      - uses: actions/checkout@v4
      - name: Show host and toolchain
        run: |
          sw_vers
          xcodebuild -version
      - name: lane-ios (xcodebuild build)
        working-directory: ios
        run: >
          xcodebuild build
          -project Moviecal.xcodeproj
          -scheme Moviecal
          -destination 'platform=iOS Simulator,name=iPhone 17'
      - name: lane-ios (xcodebuild test)
        working-directory: ios
        run: >
          xcodebuild test
          -project Moviecal.xcodeproj
          -scheme Moviecal
          -destination 'platform=iOS Simulator,name=iPhone 17'
