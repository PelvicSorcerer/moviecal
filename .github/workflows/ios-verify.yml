name: ios-verify

on:
  push:
    branches:
      - master
      - agent/**
      - docs/**
      - chore/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: iOS lane changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Detect iOS-relevant changes
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/ios-lane-changes.mjs >> "$GITHUB_OUTPUT"
  lane-ios:
    name: lane-ios
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.should_run == 'true')
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    runs-on:
      - self-hosted
      - macOS
      - ios
    steps:
      - uses: actions/checkout@v4
      - name: Show host and toolchain
        run: |
          sw_vers
          xcodebuild -version
      - name: lane-ios (xcodebuild build)
        working-directory: ios
        run: >
          xcodebuild build
          -project Moviecal.xcodeproj
          -scheme Moviecal
          -destination 'platform=iOS Simulator,name=iPhone 17'
      - name: lane-ios (xcodebuild test)
        working-directory: ios
        run: >
          xcodebuild test
          -project Moviecal.xcodeproj
          -scheme Moviecal
          -destination 'platform=iOS Simulator,name=iPhone 17'
