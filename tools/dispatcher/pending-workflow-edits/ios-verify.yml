name: ios-verify

on:
  push:
    branches:
      - master
      - agent/**
      - docs/**
      - chore/**
    paths:
      - 'ios/**'
      - '.github/workflows/ios-verify.yml'
      - 'AGENTS.md'
      - 'docs/operators/branch-and-ci-conventions.md'
      - 'docs/operators/branch-prefixes.json'
      - 'docs/planning/testing-lanes.md'
      - 'docs/planning/native-ios-app-plan.md'
      - 'docs/planning/issue-236-implementation-brief.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-verify:
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      XCODE_PROJECT: ios/Moviecal.xcodeproj
      XCODE_SCHEME: Moviecal
    runs-on:
      - self-hosted
      - macOS
      - ios
    steps:
      - uses: actions/checkout@v4
      - name: Show host and toolchain
        run: |
          sw_vers
          xcodebuild -version
      - name: List available simulator runtimes and devices
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            build
      - name: Run XCTest smoke suite on iOS Simulator
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            test
